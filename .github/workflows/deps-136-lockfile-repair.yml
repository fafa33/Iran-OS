name: PR 136 lockfile repair

on:
  push:
    branches:
      - dependabot/npm_and_yarn/npm_and_yarn-bcc754c14e
    paths:
      - .github/workflows/deps-136-lockfile-repair.yml

permissions:
  contents: write

jobs:
  repair-lockfile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: dependabot/npm_and_yarn/npm_and_yarn-bcc754c14e
          fetch-depth: 0

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Regenerate compatible lockfile
        run: npm install --package-lock-only --ignore-scripts

      - name: Verify dependency boundary
        run: |
          node <<'NODE'
          const lock = require('./package-lock.json');
          const packages = lock.packages || {};
          const hardhat = packages['node_modules/hardhat']?.version;
          const toolbox = packages['node_modules/@nomicfoundation/hardhat-toolbox']?.version;
          const lodash = packages['node_modules/lodash']?.version;
          const admZip = packages['node_modules/adm-zip']?.version;
          const undici = packages['node_modules/undici']?.version;
          if (!hardhat || !hardhat.startsWith('2.')) throw new Error(`Hardhat must remain 2.x, got ${hardhat}`);
          if (!toolbox || !toolbox.startsWith('6.')) throw new Error(`Toolbox must remain 6.x, got ${toolbox}`);
          if (lodash !== '4.18.1') throw new Error(`Expected lodash 4.18.1, got ${lodash}`);
          if (admZip !== '0.6.0') throw new Error(`Expected adm-zip 0.6.0, got ${admZip}`);
          if (undici !== '6.28.0') throw new Error(`Expected undici 6.28.0, got ${undici}`);
          console.log({ hardhat, toolbox, lodash, admZip, undici });
          NODE

      - name: Verify clean install and compile
        run: |
          npm ci --ignore-scripts
          npm run compile

      - name: Commit repaired lockfile and remove one-shot workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git rm .github/workflows/deps-136-lockfile-repair.yml
          if git diff --cached --quiet; then
            echo "No lockfile changes required"
            exit 0
          fi
          git commit -m "fix(deps): resolve security updates on Hardhat 2"
          git push origin HEAD:dependabot/npm_and_yarn/npm_and_yarn-bcc754c14e

# retry after canonical CodeQL setup
