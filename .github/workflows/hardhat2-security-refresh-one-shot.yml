name: Hardhat 2 Security Refresh (one-shot)

on:
  push:
    branches:
      - chore/hardhat2-security-refresh

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: chore/hardhat2-security-refresh
          fetch-depth: 0

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Regenerate lockfile from maintained Hardhat 2 line
        run: |
          npm install --save-dev hardhat@2.29.0 @nomicfoundation/hardhat-toolbox@6.1.2
          npm run compile
          npm test

      - name: Verify toolchain boundary
        run: |
          node -e "const p=require('./package.json'); if (!p.devDependencies.hardhat.startsWith('^2.29.0')) process.exit(1); if (!p.devDependencies['@nomicfoundation/hardhat-toolbox'].startsWith('^6.1.2')) process.exit(1);"
          npm ls hardhat @nomicfoundation/hardhat-toolbox

      - name: Commit generated lockfile and remove one-shot workflow
        run: |
          rm .github/workflows/hardhat2-security-refresh-one-shot.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json .github/workflows/hardhat2-security-refresh-one-shot.yml
          git diff --cached --check
          git commit -m "chore(deps): lock maintained Hardhat 2 security refresh"
          git push origin HEAD:chore/hardhat2-security-refresh
