name: Trigger persistence expectation fix (one-shot)

on:
  push:
    branches:
      - feat/trigger-protocol-deployment

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/trigger-protocol-deployment
          fetch-depth: 0

      - name: Update deployment-persistence expectations
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('test/32_deployment_workflow.test.js')
          s=p.read_text()
          s=s.replace('''      // 12 deploy steps (kernel, treasury, swf, victim_fund,\n      // constitution_guard, jury_selection, justice_protocol, citizen_card,\n      // price_oracle, token, oracle, recognized_backing) each call\n      // persistStep once, before the role-wiring/verify steps run.\n      expect(snapshots.length).to.equal(12);''','''      // 13 deploy steps persist addresses individually, and TriggerProtocol\n      // wiring adds one additional persistence checkpoint after its Treasury\n      // role and Kernel pointer postconditions are satisfied.\n      expect(snapshots.length).to.equal(14);''')
          s=s.replace('Object.keys(snapshots[11]).sort()', 'Object.keys(snapshots[13]).sort()')
          s=s.replace('''          "SWF_ADDRESS",\n          "VICTIM_FUND_ADDRESS",''','''          "SWF_ADDRESS",\n          "TRIGGER_PROTOCOL_ADDRESS",\n          "VICTIM_FUND_ADDRESS",''')
          s=s.replace('''        // duplicate court member, after all 12 deploy steps already\n        // succeeded and persisted.''','''        // duplicate court member, after all 13 deploy steps already\n        // succeeded and persisted; TriggerProtocol authority wiring has not run.''')
          s=s.replace('// All 12 addresses are real, non-zero deployed contract addresses,', '// All 13 addresses are real, non-zero deployed contract addresses,')
          p.write_text(s)
          PY

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run deployment workflow tests
        run: npx hardhat test test/32_deployment_workflow.test.js test/33_trigger_protocol_deployment.test.js

      - name: Commit fix and self-remove
        run: |
          rm .github/workflows/trigger-persistence-test-fix-one-shot.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add test/32_deployment_workflow.test.js .github/workflows/trigger-persistence-test-fix-one-shot.yml
          git diff --cached --check
          git commit -m "test(deploy): align persistence checks with TriggerProtocol"
          git push origin HEAD:feat/trigger-protocol-deployment
