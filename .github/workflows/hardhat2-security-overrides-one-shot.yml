name: Hardhat 2 Security Overrides (one-shot)

on:
  push:
    branches:
      - chore/hardhat2-security-refresh

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: chore/hardhat2-security-refresh
          fetch-depth: 0

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply overrides and regenerate lockfile
        run: npm install

      - name: Verify resolved security-sensitive versions
        run: |
          node -e "const lock=require('./package-lock.json'); const p=lock.packages; if (p['node_modules/hardhat/node_modules/ws']?.version !== '7.5.13') throw new Error('Hardhat ws is not 7.5.13'); if (p['node_modules/undici']?.version !== '6.28.0' && p['node_modules/hardhat/node_modules/undici']?.version !== '6.28.0') throw new Error('Hardhat undici is not 6.28.0');"
          npm ls hardhat @nomicfoundation/hardhat-toolbox ws undici

      - name: Compile
        run: npm run compile

      - name: Test
        run: npm test

      - name: Commit lockfile and self-remove
        run: |
          rm .github/workflows/hardhat2-security-overrides-one-shot.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json .github/workflows/hardhat2-security-overrides-one-shot.yml
          git diff --cached --check
          git commit -m "chore(deps): lock Hardhat security overrides"
          git push origin HEAD:chore/hardhat2-security-refresh
