name: Slither Static Analysis

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  slither:
    name: Slither Analysis
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Compile contracts
        run: npm run compile

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Slither
        run: pip install slither-analyzer==0.11.5

      - name: Run Slither
        id: slither
        run: |
          # Run Slither; capture exit code without failing the step.
          # Exit 0 = no findings. Exit 1 or 255 = findings present (both are normal;
          # Slither v0.11.x uses sys.exit(-1) which becomes 255 in bash). Other = tool error.
          slither . \
            --hardhat-ignore-compile \
            --json slither-report.json \
            2>&1 | tee slither-output.txt
          SLITHER_EXIT="${PIPESTATUS[0]}"
          echo "slither_exit=${SLITHER_EXIT}" >> "$GITHUB_OUTPUT"

          # Write a summary to the job summary page.
          {
            echo "## Slither Static Analysis"
            echo ""
            if [ "$SLITHER_EXIT" -eq 0 ]; then
              echo "**Result:** No findings detected."
            elif [ "$SLITHER_EXIT" -eq 1 ] || [ "$SLITHER_EXIT" -eq 255 ]; then
              echo "**Result:** Findings detected (see artifacts). This is non-blocking; review new findings against the baseline in \`docs/reports/SLITHER_BASELINE_AUDIT.md\`."
            else
              echo "**Result:** Slither encountered a tool error (exit code ${SLITHER_EXIT}). Check the step log."
            fi
            echo ""
            echo "Baseline: 130 findings documented in \`docs/reports/SLITHER_BASELINE_AUDIT.md\`."
            echo "Triage guidance: \`docs/reports/SLITHER_REMEDIATION_PRIORITY_MATRIX.md\`."
          } >> "$GITHUB_STEP_SUMMARY"

          # Fail only on tool error — findings (exit 1 or 255) are non-blocking.
          if [ "$SLITHER_EXIT" -ne 0 ] && [ "$SLITHER_EXIT" -ne 1 ] && [ "$SLITHER_EXIT" -ne 255 ]; then
            echo "::error::Slither exited with unexpected code ${SLITHER_EXIT}. See step log for details."
            exit "$SLITHER_EXIT"
          fi

      - name: Upload Slither JSON report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: slither-report-json
          path: slither-report.json
          retention-days: 30

      - name: Upload Slither text output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: slither-report-text
          path: slither-output.txt
          retention-days: 30
