name: Slither Static Analysis

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  slither:
    name: Slither Analysis
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Compile contracts
        run: npm run compile

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Slither
        run: pip install slither-analyzer==0.11.5

      - name: Run Slither
        id: slither
        run: |
          # Findings are non-blocking via --fail-none; nonzero means Slither failed.
          # Exclude test-only fuzzing harnesses from the production-contract baseline.
          slither . \
            --hardhat-ignore-compile \
            --filter-paths "contracts/fuzzing" \
            --fail-none \
            --json slither-report.json \
            2>&1 | tee slither-output.txt
          SLITHER_EXIT="${PIPESTATUS[0]}"
          echo "slither_exit=${SLITHER_EXIT}" >> "$GITHUB_OUTPUT"

          {
            echo "## Slither Static Analysis"
            echo ""
            if [ "$SLITHER_EXIT" -eq 0 ]; then
              echo "**Result:** Slither completed successfully. Findings, if present, are non-blocking and available in the artifacts."
            else
              echo "**Result:** Slither failed with exit code ${SLITHER_EXIT}. Check the step log."
            fi
            echo ""
            echo "Scope: production-contract baseline; excludes \`contracts/fuzzing/\`."
            echo "Baseline: 130 findings documented in \`docs/reports/SLITHER_BASELINE_AUDIT.md\`."
            echo "Triage guidance: \`docs/reports/SLITHER_REMEDIATION_PRIORITY_MATRIX.md\`."
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$SLITHER_EXIT" -ne 0 ]; then
            echo "::error::Slither failed with exit code ${SLITHER_EXIT}. See step log for details."
            exit "$SLITHER_EXIT"
          fi

      - name: Upload Slither JSON report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: slither-report-json
          path: slither-report.json
          if-no-files-found: warn
          retention-days: 30

      - name: Upload Slither text output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: slither-report-text
          path: slither-output.txt
          if-no-files-found: warn
          retention-days: 30
