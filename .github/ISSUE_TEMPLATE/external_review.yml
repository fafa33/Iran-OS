name: External Review Submission
description: Submit findings from an independent review of IranOS contracts, documentation, or whitepaper traceability. Related to Issue #35 (Step 13).
title: "[External Review]: "
labels:
  - external-review
  - step13
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reviewing IranOS. This template is for submitting independent review findings related to **Step 13** ([Issue #35](https://github.com/fafa33/Iran-OS/issues/35)).

        **Required before submitting:** Read the reviewer primer first:

        - [Reviewer Primer — English](https://github.com/fafa33/Iran-OS/blob/main/docs/REVIEWER_PRIMER.md)
        - [راهنمای بازبین — فارسی](https://github.com/fafa33/Iran-OS/blob/main/docs/REVIEWER_PRIMER_FA.md)

        IranOS is a sovereign resilience infrastructure, not a DeFi protocol, DAO, governance-token system, central-bank simulator, or yield-maximization platform. Design choices such as Kernel immutability, oracle non-sovereignty, fixed constitutional safeguards, and monetary discipline are intentional security properties.

        After reading the primer, continue with [docs/step13/STEP13_REVIEWER_INDEX_EN.md](https://github.com/fafa33/Iran-OS/blob/main/docs/step13/STEP13_REVIEWER_INDEX_EN.md) and [docs/step13/STEP13_REVIEWER_INSTRUCTIONS_FA.md](https://github.com/fafa33/Iran-OS/blob/main/docs/step13/STEP13_REVIEWER_INSTRUCTIONS_FA.md).

        Submitting this form does not close Issue #35, Step 13, or any Step 12 blocker.

  - type: checkboxes
    id: reviewer_primer_confirmation
    attributes:
      label: Reviewer Primer Confirmation
      options:
        - label: I have read the Reviewer Primer before submitting this review.
          required: true
        - label: I understand that IranOS is not a DeFi protocol, DAO, governance-token system, central-bank simulator, or yield-maximization platform.
          required: true
        - label: I understand that Kernel immutability, oracle non-sovereignty, fixed constitutional safeguards, and monetary discipline are intentional security properties, not ordinary implementation limitations.
          required: true

  - type: textarea
    id: background
    attributes:
      label: Reviewer Background
      description: Brief description of your relevant background (Solidity, formal verification, governance, Persian law, etc.). No personal information required.
      placeholder: |
        e.g. Smart contract auditor with 3 years experience, familiar with OpenZeppelin AccessControl patterns.
    validations:
      required: true

  - type: textarea
    id: reviewed_documents
    attributes:
      label: Reviewed Documents / Contracts
      description: List the specific files, contracts, or documents you reviewed.
      placeholder: |
        - docs/REVIEWER_PRIMER.md
        - docs/REVIEWER_PRIMER_FA.md
        - contracts/kernel.sol
        - docs/step13/WHITEPAPER_STEP13_CROSS_FARGARD_FIDELITY_REVIEW_FA.md
        - whitepaper/whitepaper-fa.md (Fargard 4)
    validations:
      required: true

  - type: textarea
    id: findings
    attributes:
      label: Findings
      description: Describe your findings. Include file references and line numbers where applicable.
      placeholder: |
        Finding 1: [file:line] — description
        Finding 2: [file:line] — description
    validations:
      required: true

  - type: textarea
    id: concerns
    attributes:
      label: Concerns
      description: Any broader concerns about architecture, constitution alignment, or security posture?
    validations:
      required: false

  - type: textarea
    id: recommendations
    attributes:
      label: Recommendations
      description: What changes or follow-up actions do you recommend? If recommending flexibility, upgradeability, oracle authority, dynamic thresholds, or automation of final constitutional decisions, explain why the recommendation does not weaken constitutional invariants.
    validations:
      required: false

  - type: checkboxes
    id: constitutional_safety
    attributes:
      label: Constitutional Safety Confirmation
      options:
        - label: My recommendations do not require making the Kernel upgradeable unless explicitly framed as a constitutional-risk finding.
          required: true
        - label: My recommendations do not grant oracles sovereign, treasury, reserve, freeze, or monetary authority unless explicitly framed as a constitutional-risk finding.
          required: true
        - label: My recommendations do not convert constitutional thresholds or monetary safeguards into ordinary configurable parameters unless explicitly framed as a constitutional-risk finding.
          required: true

  - type: dropdown
    id: conflict_of_interest
    attributes:
      label: Conflict of Interest Declaration
      description: Do you have any financial, political, or personal interest in this project?
      options:
        - "No conflict of interest"
        - "Yes — described in Concerns field"
    validations:
      required: true

  - type: checkboxes
    id: non_claim
    attributes:
      label: Non-Claim Confirmation
      options:
        - label: This submission does not claim to close Issue #35, Step 13, or any Step 12 blocker.
          required: true
        - label: This submission does not claim production readiness, release approval, completed audit, or completed formal verification for IranOS.
          required: true
        - label: I understand that IranOS is not production-ready and no external audit has been completed.
          required: true
