name: Bug Report
description: Report a bug in IranOS smart contracts, tests, or documentation.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        **IranOS is not production-ready.** Filing this report does not close any Step 12 blocker or claim production readiness.
        Please describe the bug clearly so it can be reproduced and evaluated.

  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction Steps
      description: Step-by-step instructions to reproduce the issue.
      placeholder: |
        1. Deploy contract X with parameters Y
        2. Call function Z
        3. Observe unexpected behavior
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What should happen?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happens? Include error messages, stack traces, or test output.
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Relevant version information.
      placeholder: |
        - Node.js version:
        - Hardhat version:
        - Solidity version:
        - OS:
        - Commit hash:
    validations:
      required: true

  - type: dropdown
    id: security_impact
    attributes:
      label: Security Impact
      description: Does this bug have a potential security impact?
      options:
        - "No — functional or documentation bug only"
        - "Yes — potential security impact (describe in Actual Behavior)"
        - "Unsure"
    validations:
      required: true

  - type: checkboxes
    id: non_claim
    attributes:
      label: Non-Claim Confirmation
      options:
        - label: Filing this report does not claim production readiness, release approval, completed audit, or completed formal verification.
          required: true
        - label: I have not attached this report to any Step 12 blocker closure without required evidence and signoff.
          required: true
